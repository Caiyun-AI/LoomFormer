# LoomFormer-Medium (432,112,228 params; Paper Section 5.1 & Appendix D)
base_config: "base.yml"

# Backbone & dimensions (D = 16 * 75 = 1200, L = 18)
base_emb_dim: 1200
base_num_query_heads: 16
base_num_kv_heads: 16
head_dim: 75
base_mlp_dim: 2510
base_num_decoder_layers: 18
vocab_size: 50432
logits_via_embedding: False
normalization_layer_epsilon: 1.0e-6
enable_dropout: False
dropout_rate: 0.0
max_target_length: 4096

# LoomFormer hyperparameters
loom_backbone: "llama"
loom_d_k: 32
loom_d_r: 256
loom_rope_dim: 18
loom_ffn_m_dim: 1128
loom_last_ffn_x_dim: 3904
loom_embed_write_divisor: 0.0016052833
loom_pallas: True
loom_splash: True
loom_pallas_vmem_mib: 48

# Splash Attention block sizes
sa_block_q: 1024
sa_block_kv: 1024
sa_block_kv_compute: 512
sa_block_q_dkv: 1024
sa_block_kv_dkv: 1024
sa_block_kv_dkv_compute: 1024
sa_use_fused_bwd_kernel: True
remat_policy: "full"

# Optimizer & schedule (v5p-16 = 8 chips, global batch 128 sequences)
opt_type: "adam_pax"
learning_rate: 3.0e-4
learning_rate_final_fraction: 0.1
warmup_steps_fraction: 0.01
adam_b1: 0.9
adam_b2: 0.95
adam_eps: 1.0e-8
adam_weight_decay: 0.1
adamw_mask: ['.*scale$', '.*bias$', '.*b_rg.*', '.*b_wg$', '.*b_sg$', '.*c_qk$', '.*c_vo$']
gradient_clipping_threshold: 1.0
per_device_batch_size: 16.0
steps: 13500
learning_rate_schedule_steps: 13500
eval_interval: 13500
enable_nnx: False
