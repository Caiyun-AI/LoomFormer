# LoomFormer-Large (777,849,500 params; Paper Section 5.1 & Appendix D)
#
# Reproduce LoomFormer-Large on 8xA800-80GB:
#   torchrun --standalone --nproc_per_node=8 pytorch/train_loom.py --config pytorch/configs/loomformer_large.yml
# Reproduce parameter-matched Llama-Large baseline (777,850,368 params):
#   torchrun --standalone --nproc_per_node=8 pytorch/train_loom.py --config pytorch/configs/loomformer_large.yml --no-loom \
#     --out-dir pytorch/runs/llama_large_seq4096_b128

# Model architecture (D = 16 * 96 = 1536, L = 22)
preset: "large"
loom_enabled: true
vocab_size: 50432
hidden_size: 1536
num_layers: 22
num_heads: 16
head_dim: 96
intermediate_size: 3317
ffn_m_dim: 1539
last_ffn_x_dim: 5083
d_k: 32
d_r: 256
rope_dim: 24
situ_beta1: 0.0
situ_beta2: 0.0
init_std: 0.006

# Runtime & memory optimization
compile: true
compile_mode: "default"
grad_checkpoint: true
dtype: "bfloat16"

# Schedule & optimizer (~14.16B tokens = 27000 steps * 524,288 tok/step; 8 GPUs: 16 * 8 * 1 = 128)
seq_len: 4096
batch_size: 128
micro_batch_size: 16
grad_accum: 1
steps: 27000
lr: 2.5e-4
min_lr_ratio: 0.1
warmup_steps: 270
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
seed: 42

# Data, evaluation & checkpointing
num_train_shards: 103
log_every: 25
eval_every: 1000
val_tokens: 2097152
final_val_tokens: 10485760
out_dir: "pytorch/runs/loomformer_large_seq4096_b128"
save_ckpt: true
verify_inference: true
